<div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100 col-span-1 md:col-span-3">
            <h3 class="text-xl font-semibold mb-4 text-emerald-700">📜 Resident Services</h3>
            
            <div class="grid md:grid-cols-2 gap-8">
                <div class="bg-gray-50 p-4 rounded border border-gray-200">
                    <h4 class="font-semibold mb-2">1. New Resident Registration</h4>
                    <p class="text-sm text-gray-600 mb-3">Not in the system? Add your details below.</p>
                    <input type="text" id="regId" placeholder="Create an ID (e.g., jsmith)" class="w-full mb-2 p-2 border rounded">
                    <input type="text" id="regName" placeholder="Full Legal Name" class="w-full mb-2 p-2 border rounded">
                    <input type="text" id="regAddress" placeholder="Full Home Address" class="w-full mb-3 p-2 border rounded">
                    <button onclick="registerUser()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded transition">
                        Register
                    </button>
                </div>

                <div class="bg-emerald-50 p-4 rounded border border-emerald-200">
                    <h4 class="font-semibold mb-2">2. Get Official Certificate</h4>
                    <p class="text-sm text-gray-600 mb-3">Already registered? Enter your ID to pay and generate your stamped certificate.</p>
                    <input type="text" id="certId" placeholder="Your Resident ID" class="w-full mb-4 p-2 border rounded">
                    <button onclick="requestCertificate()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-4 rounded transition">
                        Pay & Download Certificate
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function registerUser() {
            const data = {
                resident_id: document.getElementById('regId').value,
                name: document.getElementById('regName').value,
                address: document.getElementById('regAddress').value
            };

            if(!data.resident_id || !data.name || !data.address) return alert("Please fill all fields");

            const response = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            
            if (response.ok) {
                alert(result.message);
                document.getElementById('certId').value = data.resident_id; // Auto-fill next step
            } else {
                alert("Error: " + result.detail);
            }
        }

        async function requestCertificate() {
            const resId = document.getElementById('certId').value;
            if(!resId) return alert("Please enter your Resident ID");

            const button = event.target;
            button.innerText = "Processing Payment...";
            button.disabled = true;

            try {
                const response = await fetch('/request-certificate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        resident_id: resId,
                        payment_token: "tok_mock_123" // Mock payment token
                    })
                });
                const data = await response.json();
                
                if (response.ok) {
                    alert("Payment Successful! Downloading certificate.");
                    window.location.href = data.download_url;
                } else {
                    alert("Error: " + data.detail);
                }
            } catch (error) {
                alert("Failed to contact the server.");
            } finally {
                button.innerText = "Pay & Download Certificate";
                button.disabled = false;
            }
        }
    </script>
</body>
</html>
